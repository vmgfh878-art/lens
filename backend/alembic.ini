[alembic]
# CP236d — Alembic 골격. 실 마이그레이션은 Supabase Pro 결제 후 활성.
# DB URL은 env.py가 환경변수에서 조립한다 — 비밀번호 하드코딩 금지.
script_location = migrations
prepend_sys_path = ..
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
