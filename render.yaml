services:
  - type: web
    name: lens-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # 비공개 GitHub 릴리스의 검증 스냅샷만 읽는다. Supabase 설정보다 우선한다.
      - key: LENS_DATA_BACKEND
        value: local
      # 코드 저장소에는 검증된 폴백 한 벌만 고정한다. 정상 운영에서는 원격 버전을 쓴다.
      - key: LENS_SERVING_DATA_DIR
        value: backend/data/bootstrap/v1
      - key: LENS_SERVING_BOOTSTRAP_DIR
        value: backend/data/bootstrap/v1
      - key: LENS_SERVING_STORAGE
        value: github_release
      - key: LENS_GITHUB_REPOSITORY
        value: vmgfh878-art/lens-serving
      - key: LENS_GITHUB_RELEASE_TAG
        value: serving-snapshots
      # 실행 중 새 릴리스를 5분마다 검사한다. 재시작 시에도 즉시 검사한다.
      - key: LENS_REMOTE_SYNC_INTERVAL_SECONDS
        value: '300'
      # 이 저장소의 Contents 읽기 권한만 있는 전용 토큰을 사용한다.
      - key: LENS_GITHUB_TOKEN
        sync: false
      # 관리 API로 수동 즉시 동기화할 때만 사용한다. 일일 발행은 주기 동기화한다.
      - key: LENS_ADMIN_RELOAD_TOKEN
        sync: false
      # 이전 Supabase 설정이 남아 있어도 LENS_DATA_BACKEND=local이 우선한다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # 직접 Postgres 연결(결제 후 활성). 포트는 5432(direct) — 6543(pooled) 금지. ADR-0013.
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT      # 5432 권장. 6543 금지(PgBouncer transaction mode).
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_NAME
        sync: false

# 서버 크론 비활성. 로컬 윈도우 자동화가 계산 후 비공개 릴리스 첨부파일만 갱신한다.
