repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        # CP222 baseline: ruff 2155건 / mypy 1391 에러가 backend/app에
        # pre-existing. 좁은 정리 CP(F401 fix, dead 제거 등)가 commit 단계에
        # 막히지 않도록 hook은 자동수정 가능한 F401만 검사. 전체 룰 측정은
        # pyproject.toml [tool.ruff.lint] select 그대로 유지.
        args: ["--fix", "--select=F401"]
      - id: ruff-format
  # CP237 — mypy hook 복원 (CP224b 임시 비활성화 해제).
  # CP222 baseline 1391 errors 가 pre-existing 이라 매 commit 을 자동으로
  # 막으면 안 됨 → stages: [manual] 로 둠. 사용자 commit 시 자동 실행 X.
  # 수동 / CI 실행 경로:
  #   pre-commit run --hook-stage manual mypy -a
  # CI (.github/workflows/ci.yml) 는 mypy backend ai 를 별도 step 으로 측정.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        stages: [manual]
        additional_dependencies: []
        args: ["--config-file=pyproject.toml"]
  # CP243 — backend 복잡도 게이트. mypy 처럼 manual stage (commit 자동 차단 X).
  #   실행: pre-commit run --hook-stage manual xenon -a
  - repo: local
    hooks:
      - id: xenon
        name: xenon (backend complexity)
        entry: xenon --max-absolute C --max-modules B --max-average A backend/app
        language: system
        pass_filenames: false
        stages: [manual]
  # CP239 — gitleaks pre-commit hook 은 Windows 환경에서 unreliable (v8.21.2
  # protect deprecated / v8.30.1 git --pre-commit 가 staged 검사 안 함 / local
  # detect --no-git --source . 가 allowlist 의 알 수 없는 흡수 동작). off-ramp:
  # local hook 제거하고 CI gate (.github/workflows/ci.yml 의 secrets job) 가
  # 진짜 enforcement. defense in depth 약화는 ADR-0030 에 명시 acknowledged.
